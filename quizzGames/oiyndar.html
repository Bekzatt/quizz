    <div class="tugscene" id="tscene"><div class="tugscore">${T.map((t,i)=>`<span style="--c:${t.c}"><span class="badge" style="--c:${t.c};width:30px;height:30px">${t.av}</span>${esc(t.name)} <b id="ts${i}">0</b></span>`).join('')}</div>
      <svg viewBox="0 0 1000 260" preserveAspectRatio="xMidYMax meet" id="tsvg">
        <line x1="${500-10*STEP*U}" y1="150" x2="${500-10*STEP*U}" y2="232" stroke="${T[0].c}" stroke-width="5" stroke-dasharray="10 8"/>
        <line x1="${500+10*STEP*U}" y1="150" x2="${500+10*STEP*U}" y2="232" stroke="${T[1].c}" stroke-width="5" stroke-dasharray="10 8"/>
        <line x1="500" y1="140" x2="500" y2="236" stroke="#FFF4DC" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
        <g id="rope">
          <g id="ropeLine"><path d="M-90 ${ROPE_Y}Q500 ${ROPE_Y+8} 1090 ${ROPE_Y}" stroke="#B5803B" stroke-width="9" fill="none"/>
            <path d="M-90 ${ROPE_Y}Q500 ${ROPE_Y+8} 1090 ${ROPE_Y}" stroke="#7A4E1E" stroke-width="9" fill="none" stroke-dasharray="5 9"/></g>
          <g id="knot" transform="translate(500 ${ROPE_Y+4})"><g id="flag"><path d="M0 0L-15 42Q0 34 15 42Z" fill="#A8322A" stroke="#E9C46A" stroke-width="2.5"/>
            <path d="M0 12v20M-6 22h12" stroke="#E9C46A" stroke-width="2"/></g><circle r="9" fill="#E9C46A" stroke="#6B4226" stroke-width="3"/></g>
          ${[0,1].map(tm=>`<g id="tm${tm}"${tm?' transform="translate(1000 0) scale(-1 1)"':''}>${XS.map((x,k)=>`<g class="pos" transform="translate(${x} 205) scale(${SC})">${batyr(tm,k)}</g>`).join('')}<g class="dust"></g></g>`).join('')}
        </g>
      </svg><div class="pullfx" id="pfx0"></div><div class="pullfx r" id="pfx1"></div></div>
    <div class="tugpanels">${T.map((t,i)=>`<div class="panel" id="pn${i}" style="--c:${t.c}"><div class="ph"><span>${t.av} ${esc(t.name)}</span><span class="keys">${KLAB[i].join(' ')}</span></div>
      <div class="qline"></div><div class="opts" style="display:grid;gap:8px"></div><div class="lockmsg">Қате! Күте тұр…</div></div>`).join('')}</div>
  </div>`;

  // ---------- анимация: әр кадрда әр батырдың денесі, қолы, аяғы ----------
  const F=[0,1].map(tm=>[...$(`#tm${tm}`).querySelectorAll('.fig')].map((el,k)=>({el,k,lean:el.querySelector('.lean'),arms:[...el.querySelectorAll('.arm')],
    cape:el.querySelector('.cape'),plume:el.querySelector('.plume')})));
  // imp — соңғы оқиғаның әсері (біртіндеп сөнеді): lean (градус), dx (артқа/алға қадам), hop (секіру)
  const imp=[{lean:0,dx:0,hop:0,wob:0},{lean:0,dx:0,hop:0,wob:0}];
  const mode=['pull','pull']; // pull | cheer | fall
  let ropeShake=0, last=performance.now(), t0=last;
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000), t=(now-t0)/1000; last=now;
    for(let tm=0;tm<2;tm++){
      const m=imp[tm], dec=Math.exp(-dt*5);
      m.lean*=dec; m.dx*=dec; m.hop*=Math.exp(-dt*7); m.wob*=Math.exp(-dt*3);
      F[tm].forEach(f=>{
        const ph=t*5.4+f.k*1.25+tm*.8;
        let lean=-28+3.5*Math.sin(ph)+m.lean+m.wob*Math.sin(t*22+f.k), dx=m.dx+1.5*Math.sin(ph*.5), dy=-Math.abs(m.hop)*Math.max(0,Math.sin(t*16+f.k*.9)), rot=0, arm=0;
        if(mode[tm]==='cheer'){ lean=-4+3*Math.sin(t*9+f.k); dy=-Math.abs(Math.sin(t*7+f.k*1.1))*22; arm=-115+12*Math.sin(t*14+f.k); dx=0; }
        if(mode[tm]==='fall'){ f.fall=Math.min(78,(f.fall||0)+dt*160*(1+f.k*.2)); rot=f.fall; lean=-6; arm=-20; dx=0; dy=0; }
        f.el.setAttribute('transform',`translate(${dx.toFixed(1)} ${dy.toFixed(1)}) rotate(${rot.toFixed(1)} 20 0)`);
        f.lean.setAttribute('transform',`translate(-6 -58) rotate(${lean.toFixed(1)})`);
        f.arms.forEach((a,j)=>a.setAttribute('transform',`rotate(${(arm+(j?0:4)*Math.sin(t*6)).toFixed(1)} 1 -45)`));
        if(f.cape) f.cape.setAttribute('transform',`rotate(${(5*Math.sin(t*9)+(mode[tm]==='pull'?0:8)).toFixed(1)} -4 -46)`);
        if(f.plume) f.plume.setAttribute('transform',`rotate(${(-10*Math.abs(Math.sin(t*7))).toFixed(1)} 2 -100)`);
      });
    }
    ropeShake*=Math.exp(-dt*4);
    const vib=(st.done?0:.8+ropeShake)*Math.sin(t*55);
    $('#ropeLine').setAttribute('transform',`translate(0 ${vib.toFixed(2)})`);
    $('#flag').setAttribute('transform',`rotate(${(6*Math.sin(t*3)+ropeShake*4*Math.sin(t*20)).toFixed(1)})`);
    raf=requestAnimationFrame(frame);
  }
  function dust(tm,big){ const g=$(`#tm${tm} .dust`);
    XS.forEach(x=>{ for(let j=0;j<(big?4:2);j++){ const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
      const sx=x+rnd(-26,32); e.setAttribute('cx',sx); e.setAttribute('cy',203); e.setAttribute('rx',rnd(6,11)); e.setAttribute('ry',rnd(3,5)); e.setAttribute('fill','#D8B98C');
      g.appendChild(e); e.animate([{opacity:.75,transform:'translate(0,0) scale(1)'},{opacity:0,transform:`translate(${rnd(18,40)}px,${-rnd(6,16)}px) scale(2.2)`}],{duration:700,easing:'ease-out'});
      setTimeout(()=>e.remove(),720); } }); }
  function pullFx(tm,txt,col){ const d=$(`#pfx${tm}`); d.textContent=txt; d.style.color=col; d.getAnimations().forEach(a=>a.cancel());
    d.animate([{opacity:0,transform:'translateY(10px) scale(.8)'},{opacity:1,transform:'translateY(0) scale(1.1)',offset:.2},{opacity:1,transform:'translateY(-6px) scale(1)',offset:.7},{opacity:0,transform:'translateY(-20px)'}],{duration:900}); }
  function yank(tm){ // дұрыс жауап: команда серпе тартады, қарсыластар алға сүрінеді
    imp[tm].lean-=17; imp[tm].dx-=14; imp[1-tm].lean+=22; imp[1-tm].dx+=12; imp[1-tm].hop=10; ropeShake=3;
    dust(tm,true); dust(1-tm,false); pullFx(tm,'ТАРТ!','#FFF4DC');
    $('#tscene').animate([{transform:'translateX(0)'},{transform:`translateX(${tm?3:-3}px)`},{transform:'translateX(0)'}],{duration:180});
  }
  function slip(tm){ imp[tm].lean+=20; imp[tm].dx+=10; imp[tm].wob=8; dust(tm,false); pullFx(tm,'Тайып кетті!','#FFC2B8'); }

  // pos бірлігі × U = viewBox пикселі; экрандағы масштабты SVG өзі ескереді
  function drawRope(){ $('#rope').style.transform=`translateX(${st.pos*U}px)`; }
  function nextQ(t){ const q=st.q[t]=st.decks[t].next(); st.opts[t]=options(q); const p=$(`#pn${t}`);
    p.querySelector('.qline').textContent=q.q; p.querySelector('.opts').innerHTML=ansButtons(st.opts[t],t); }
  function answer(t,i){
    if(st.done||st.lock[t]||i>=st.opts[t].length) return;
    const btn=$(`#pn${t} [data-i="${i}"]`), p=$(`#pn${t}`);
    if(st.opts[t][i]===st.q[t].a){
      st.ok[t]++; $(`#ts${t}`).textContent=st.ok[t]; btn.classList.add('ok'); sfx.ok(); sfx.pull();
      st.pos+= t===0?-STEP:STEP; drawRope(); yank(t);
      st.lock[t]=1; later(()=>{ st.lock[t]=0; if(!st.done) nextQ(t); },450);
      if(Math.abs(st.pos)>=STEP*10) finish(t);
    } else {
      st.bad[t]++; btn.classList.add('bad'); sfx.bad(); st.lock[t]=1; p.classList.add('locked'); slip(t);
      const ci=st.opts[t].indexOf(st.q[t].a); p.querySelector(`[data-i="${ci}"]`).classList.add('ok');
      later(()=>{ st.lock[t]=0; p.classList.remove('locked'); if(!st.done) nextQ(t); },2000);
    }
  }
  function finish(w){
    if(st.done) return; st.done=true; cur.running=false;
    if(w<0) w = st.pos<0?0: st.pos>0?1:-1;
    if(w>=0){ mode[w]='cheer'; mode[1-w]='fall'; dust(1-w,true); sfx.win(); $('#rope').style.transform=`translateX(${w?90:-90}px)`; } // жеңген команда экраннан шығып кетпесін
    toast(w<0?'Тең түсті':`${esc(T[w].name)} жеңді!`);
    const list=[0,1].map(i=>({name:T[i].name,c:T[i].c,av:T[i].av,score:st.ok[i],sub:`${st.bad[i]} қате`}));
    if(w===1) list.reverse();
    later(()=>showResults('',w<0?'Тең түсті':`${T[w].name} жеңді!`,list,'дұрыс'),2600);
  }
  cur.key=e=>{ for(let t=0;t<2;t++){ const i=KEYS[t].indexOf(e.code); if(i>=0) answer(t,i); } };
  stage.querySelectorAll('.panel').forEach((p,t)=>p.addEventListener('pointerdown',e=>{ const b=e.target.closest('[data-i]'); if(b) answer(t,+b.dataset.i); }));
  nextQ(0); nextQ(1); drawRope(); raf=requestAnimationFrame(frame); gameClock(dur,()=>finish(-1));
}

// ================= 3. ШАРЛАР =================
function startBalloons(o){
  const n=+o.n, dur=+o.dur, COLORS=['#A8322A','#1F5C8C','#4C7A35','#B07A1C','#6A2E4E','#1C7F8E','#B5562A','#2E3F78'];
  const F=Array.from({length:n},(_,i)=>({name:o.names[i],c:TEAM[i].c,av:TEAM[i].av,score:0,ok:0,bad:0,miss:0,deck:makeDeck(),q:null,bs:[],busy:false}));
  stage.innerHTML=`<div class="bal" style="grid-template-columns:repeat(${n},1fr)">${F.map((f,i)=>`<div class="bfield" id="bf${i}" style="--c:${f.c}">
    <div class="bhead"><div class="row1"><span><span class="badge" style="--c:${f.c};width:30px;height:30px">${f.av}</span>${esc(f.name)}</span><span class="sc" id="bs${i}">0</span></div><div class="qline" id="bq${i}"></div></div>
    <div class="bsky" id="sky${i}">${[0,1,2].map(k=>`<div class="cloud" style="left:${10+k*30}%;top:${15+k*25}%;width:${90+k*20}px;height:${30+k*6}px"></div>`).join('')}</div></div>`).join('')}</div>`;
  let t0=performance.now(), last=t0, ended=false;
  function spawn(fi){
    const f=F[fi], sky=$(`#sky${fi}`); f.bs.forEach(b=>b.el.remove()); f.bs=[]; f.busy=false;
    f.q=f.deck.next(); $(`#bq${fi}`).textContent=f.q.q;
    const opts=options(f.q), W=sky.clientWidth, H=sky.clientHeight, k=opts.length;
    const bw=Math.min(W/k*.85, 200, H*.42), cols=shuffle(COLORS);
    const speedUp=1+Math.min(.6,(performance.now()-t0)/1000/dur*.6);
    opts.forEach((txt,j)=>{
      const el=document.createElement('div'); el.className='balloon'; el.style.setProperty('--w',bw+'px'); el.style.setProperty('--c',cols[j]);
      el.innerHTML=`<div class="b">${esc(txt)}</div><div class="s"></div>`; sky.appendChild(el);
      fitText(el.querySelector('.b'),Math.max(14,bw/4.5),10);
      const slot=W/k, x=slot*j+(slot-bw)/2+rnd(-slot*.08,slot*.08);
      const b={el,x,y:H+rnd(0,H*.3),v:H/rnd(6,8.5)*speedUp,ok:txt===f.q.a,ph:rnd(0,6),gone:false};
      el.addEventListener('pointerdown',e=>{ e.preventDefault(); hit(fi,b); });
      f.bs.push(b);
    });
  }
  function float(fi,b,txt,col){ const sky=$(`#sky${fi}`); const d=document.createElement('div'); d.className='plus'; d.textContent=txt; d.style.color=col;
    d.style.left=(b.x+b.el.offsetWidth/2)+'px'; d.style.top=b.y+'px'; sky.appendChild(d); setTimeout(()=>d.remove(),1000); }
  function hit(fi,b){
    const f=F[fi]; if(ended||f.busy||b.gone) return;
    b.gone=true;
    if(b.ok){ f.busy=true; f.ok++; f.score+=10; sfx.pop(); sfx.ok(); b.el.classList.add('pop'); float(fi,b,'+10','#34C759');
      later(()=>{ if(!ended) spawn(fi); },550); }
    else { f.bad++; f.score=Math.max(0,f.score-3); sfx.bad(); b.el.classList.add('wrong'); float(fi,b,'−3','#FF3B30'); }
    $(`#bs${fi}`).textContent=f.score;
  }
  function loop(t){
    const dt=Math.min(.05,(t-last)/1000); last=t;
    F.forEach((f,fi)=>{
      f.bs.forEach(b=>{ if(b.gone&&!b.el.classList.contains('wrong')&&!b.el.classList.contains('pop')) return;
        if(!b.el.classList.contains('pop')) b.y-=b.v*dt; b.ph+=dt*2;
        b.el.style.transform=`translate(${b.x+Math.sin(b.ph)*8}px,${b.y}px) rotate(${Math.sin(b.ph*.8)*4}deg)`; });
      const good=f.bs.find(b=>b.ok);
      if(!f.busy&&good&&good.y<-good.el.offsetHeight){ f.busy=true; f.miss++; sfx.bad();
        $(`#bq${fi}`).innerHTML=`Ұшып кетті. Дұрыс жауап: <span style="color:var(--green)">${esc(f.q.a)}</span>`; later(()=>{ if(!ended) spawn(fi); },1500); }
    });
    if(!ended) raf=requestAnimationFrame(loop);
  }
  F.forEach((_,i)=>spawn(i)); raf=requestAnimationFrame(loop);
  cur.stop=()=>{ ended=true; };
  gameClock(dur,()=>{ ended=true; cur.running=false;
    const list=ranked(F.map(f=>({name:f.name,c:f.c,av:f.av,score:f.score,sub:`${f.ok} дұрыс · ${f.bad} қате · ${f.miss} ұшып кетті`})));
    showResults('',n>1?winTitle(list):`${list[0].score} ұпай!`,list); });
}

// ================= 4. СӘЙКЕСТЕНДІР =================
function startMemory(o){
  const N=+o.pairs, n=+o.n;
  const T=o.names.slice(0,n).map((nm,i)=>({name:nm,c:TEAM[i].c,av:TEAM[i].av,score:0,tries:0}));
  // бірдей жауабы жоқ сұрақтар
  const seenA=new Set(), seenQ=new Set(), pairs=[];
  for(const q of shuffle(getPool()).sort((a,b)=>(a.q.length>90)-(b.q.length>90))){
    const ka=q.a.toLowerCase(), kq=q.q.toLowerCase(); if(seenA.has(ka)||seenQ.has(kq)) continue;
    seenA.add(ka); seenQ.add(kq); pairs.push(q); if(pairs.length>=N) break;
  }
  const cards=shuffle(pairs.flatMap((q,pid)=>[{pid,kind:'q',text:q.q},{pid,kind:'a',text:q.a}]));
  const total=cards.length, cols=total<=12?4:total<=16?4:5, rows=Math.ceil(total/cols);
  let turn=0, open=[], found=0, lock=false;
  stage.innerHTML=`<div class="mem"><div class="teams" id="teams"></div>
    <div class="grid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${cards.map((c,i)=>`<button class="mcard" data-i="${i}">
      <div class="in"><div class="bk">${ic('shan',3)}</div><div class="f ${c.kind}"><span class="tg">${c.kind==='q'?'СҰРАҚ':'ЖАУАП'}</span>${esc(c.text)}</div></div></button>`).join('')}</div></div>`;
  const renderTeams=()=>{ $('#teams').innerHTML=T.map((t,i)=>`<div class="tchip ${i===turn&&n>1?'on':''}${n===1?' on':''}" style="--c:${t.c}"><span class="d">${t.av}</span>${esc(t.name)}<span class="sc">${t.score}</span></div>`).join(''); };
  const fitAll=()=>stage.querySelectorAll('.mcard .f').forEach(f=>{ fitText(f,Math.min(30,f.clientHeight/3.2),9); });
  renderTeams(); requestAnimationFrame(fitAll); const onRs=()=>fitAll(); window.addEventListener('resize',onRs);
  cur.stop=()=>window.removeEventListener('resize',onRs);
  stage.querySelector('.grid').addEventListener('click',e=>{
    const el=e.target.closest('.mcard'); if(!el||lock) return; const i=+el.dataset.i;
    if(el.classList.contains('open')||el.classList.contains('done')) return;
    el.classList.add('open'); sfx.flip(); open.push(i);
    if(open.length<2) return;
    lock=true; const [a,b]=open, ea=stage.querySelector(`[data-i="${a}"]`), eb=el; T[turn].tries++;
    if(cards[a].pid===cards[b].pid){
      later(()=>{ sfx.ok(); [ea,eb].forEach(x=>{ x.classList.remove('open'); x.classList.add('done'); x.style.setProperty('--c',T[turn].c); });
        T[turn].score++; found++; open=[]; lock=false; renderTeams();
        if(found===pairs.length){ cur.running=false; later(()=>{ const list=ranked(T.map(t=>({name:t.name,c:t.c,av:t.av,score:t.score,sub:`${t.tries} жүріс`})));
          showResults('',n>1?winTitle(list):`Барлығы табылды!`,list,'жұп'); },900); }
        else if(n>1) toast('Дұрыс! Тағы бір жүріс'); },500);
    } else {
      later(()=>{ sfx.bad(); [ea,eb].forEach(x=>x.classList.add('miss')); },600);
      later(()=>{ [ea,eb].forEach(x=>x.classList.remove('open','miss')); open=[]; lock=false; if(n>1){ turn=(turn+1)%n; renderTeams(); } },1500);
    }
  });
}

// ================= 5. ДӨҢГЕЛЕК =================
function startWheel(o){
  const n=+o.n, qt=+o.qt, deck=makeDeck();
  const T=o.names.slice(0,n).map((nm,i)=>({name:nm,c:TEAM[i].c,av:TEAM[i].av,score:0,ok:0,bad:0}));
  const SEG=[{v:10,c:'#1F5C8C'},{v:50,c:'#A8322A'},{v:20,c:'#4C7A35'},{v:0,l:'Бос',c:'#8A7B66'},{v:30,c:'#6A2E4E'},{v:100,c:'#A8322A'},
             {v:20,c:'#1C7F8E'},{x2:1,l:'×2',c:'#E9C46A'},{v:40,c:'#2E3F78'},{v:10,c:'#B5562A'},{v:30,c:'#4C7A35'},{v:0,l:'Бос',c:'#8A7B66'}];
  const S=SEG.length, A=Math.PI*2/S;
  let rot=0, turn=0, spinning=false;
  stage.innerHTML=`<div class="wheel"><div class="wbox"><svg class="ptr" viewBox="0 0 40 60"><path d="M20 58L5 16a16 16 0 1 1 30 0z" fill="#C9962B" stroke="#3A1E06" stroke-width="3"/><circle cx="20" cy="17" r="6" fill="#A8322A"/></svg><canvas id="wc"></canvas><button class="hub" id="spin" aria-label="Айналдыру"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#6B4226" stroke="#3A1E06" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="#A8322A"/><g stroke="#E9C46A" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="50" cy="50" r="38"/><path d="M27 27c14 9 32 9 46 0M27 73c14-9 32-9 46 0M27 27c9 14 9 32 0 46M73 27c-9 14-9 32 0 46"/></g></svg><span>АЙНАЛДЫР</span></button></div>
    <div class="wside"><div id="wteams" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="btn" id="spin2">Айналдыру <span class="keys" style="background:rgba(0,0,0,.2);color:#FFF4DC">Space</span></button>
      <button class="btn gray" id="wend">Ойынды аяқтау</button></div></div>`;
  const cv=$('#wc'), ctx=cv.getContext('2d');
  function size(){ const r=cv.getBoundingClientRect(), d=devicePixelRatio||1; cv.width=r.width*d; cv.height=r.height*d; draw(); }
  function draw(){
    const W=cv.width, R=W/2*.98, c=W/2; ctx.clearRect(0,0,W,W);
    ctx.beginPath(); ctx.arc(c,c,R,0,Math.PI*2); ctx.fillStyle='#5A3820'; ctx.fill(); ctx.lineWidth=W/120; ctx.strokeStyle='#3A1E06'; ctx.stroke();
    for(let i=0;i<S;i++){ const a0=rot+i*A-Math.PI/2;
      ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R*.95,a0,a0+A); ctx.closePath(); ctx.fillStyle=SEG[i].c; ctx.fill();
      ctx.strokeStyle='#E9C46A'; ctx.lineWidth=W/260; ctx.stroke();
      ctx.save(); ctx.translate(c,c); ctx.rotate(a0+A/2); ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillStyle=SEG[i].x2?'#3A1E06':'#FFF4DC'; ctx.font=`700 ${W/15}px "PT Serif",Georgia,serif`;
      ctx.fillText(SEG[i].l||SEG[i].v,R*.86,0); ctx.restore(); }
    for(let i=0;i<S;i++){ const a=rot+i*A-Math.PI/2; ctx.beginPath(); ctx.arc(c+Math.cos(a)*R*.975,c+Math.sin(a)*R*.975,W/110,0,Math.PI*2); ctx.fillStyle='#E9C46A'; ctx.fill(); ctx.lineWidth=W/400; ctx.strokeStyle='#3A1E06'; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(c,c,R*.62,0,Math.PI*2); ctx.strokeStyle='rgba(233,196,106,.55)'; ctx.lineWidth=W/300; ctx.setLineDash([W/80,W/120]); ctx.stroke(); ctx.setLineDash([]);
  }
  const renderTeams=()=>{ $('#wteams').innerHTML=T.map((t,i)=>`<div class="tchip ${i===turn?'on':''}" style="--c:${t.c}"><span class="d">${t.av}</span><span style="flex:1">${esc(t.name)}</span><span class="sc">${t.score}</span></div>`).join(''); };
  function spin(){
    if(spinning||$('#ov').classList.contains('show')) return; spinning=true;
    const target=Math.floor(Math.random()*S), from=rot;
    // сағат тілімен кемінде 5 айналым, соңында target секторы көрсеткіштің астында
    const to=from+ (((-(target+.5)*A - from)%(Math.PI*2))+Math.PI*2)%(Math.PI*2) + Math.PI*2*5 + rnd(-A*.35,A*.35);
    const t0=performance.now(), D=4500; let lastSeg=-1;
    const step=t=>{ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,4); rot=from+(to-from)*e; draw();
      const sg=Math.floor(((-rot%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/A); if(sg!==lastSeg){ lastSeg=sg; sfx.tick(); }
      if(k<1) raf=requestAnimationFrame(step); else { spinning=false; land(sg); } };
    raf=requestAnimationFrame(step);
  }
  function land(i){
    const s=SEG[i];
    if(!s.x2&&!s.v){ sfx.bad(); toast('Бос! Кезек келесі командаға'); turn=(turn+1)%n; renderTeams(); return; }
    ask(s);
  }
  function ask(s){
    const t=T[turn], q=deck.next(), opts=options(q); let done=false;
    const val=s.x2?'×2':`+${s.v}`;
    $('#sheet').innerHTML=`<div class="qmodal"><div class="who"><span class="tile" style="width:36px;height:36px;border-radius:50%;background:${t.c};display:inline-flex;align-items:center;justify-content:center">${t.av}</span>${esc(t.name)} <span class="val">${val}</span></div>
      <div class="qline">${esc(q.q)}</div><div class="opts">${ansButtons(opts,null)}</div><div class="tbar" style="margin-top:14px"><i id="wtb"></i></div></div>`;
    $('#ov').classList.add('show'); $('#ov').querySelector('.sheet').classList.add('qmodal');
    $('#wtb').animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:qt*1000,fill:'forwards'});
    const finish=(ok,btn)=>{ if(done) return; done=true; clearTimeout(to);
      const ci=opts.indexOf(q.a); $('#sheet').querySelector(`[data-i="${ci}"]`).classList.add('ok');
      if(btn&&!ok) btn.classList.add('bad');
      $('#wtb').getAnimations().forEach(a=>a.pause());
      if(ok){ const g=s.x2?Math.max(t.score,10):s.v; t.score+=g; t.ok++; sfx.ok(); } else { t.bad++; sfx.bad(); }
      later(()=>{ $('#ov').classList.remove('show'); $('#sheet').classList.remove('qmodal'); toast(ok?`${esc(t.name)}: ${s.x2?'×2':'+'+s.v}`:'Қате'); turn=(turn+1)%n; renderTeams(); },1500); };
    const to=later(()=>{ toast('Уақыт бітті!'); finish(false); },qt*1000);
    $('#sheet').querySelector('.opts').onclick=e=>{ const b=e.target.closest('[data-i]'); if(b) finish(opts[+b.dataset.i]===q.a,b); };
    cur.key2=e=>{ const i=['Digit1','Digit2','Digit3'].indexOf(e.code); if(i>=0&&i<opts.length) $('#sheet').querySelector(`[data-i="${i}"]`).click(); };
  }
  cur.key=e=>{ if($('#ov').classList.contains('show')){ cur.key2&&cur.key2(e); return; } if(e.code==='Space'){ e.preventDefault(); spin(); } };
  $('#spin').onclick=spin; $('#spin2').onclick=spin;
  $('#wend').onclick=()=>{ if(spinning) return; cur.running=false; const list=ranked(T.map(t=>({name:t.name,c:t.c,av:t.av,score:t.score,sub:`${t.ok} дұрыс · ${t.bad} қате`})));
    showResults('',winTitle(list),list); };
  const onRs=()=>size(); window.addEventListener('resize',onRs); cur.stop=()=>{ window.removeEventListener('resize',onRs); $('#ov').classList.remove('show'); $('#sheet').classList.remove('qmodal'); };
  renderTeams(); requestAnimationFrame(size);
}

showMenu();
</script>
</body>
</html>
